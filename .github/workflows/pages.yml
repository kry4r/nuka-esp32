name: flash-page
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public release links
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          tag = os.environ['RELEASE_TAG'] or 'v0.1.0'
          manifest = Path('site/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = tag.removeprefix('v')
          for part in data['builds'][0]['parts']:
              filename = part['path'].rsplit('/', 1)[1]
              part['path'] = f'https://github.com/{repo}/releases/download/{tag}/{filename}'
          manifest.write_text(json.dumps(data, indent=2) + '\n')
          page = Path('site/index.html')
          page.write_text(page.read_text().replace('&lt;owner&gt;/nuka-esp32', repo))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
