# SPDX-License-Identifier: AGPL-3.0-or-later
name: release
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set public source metadata and verify release version
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          path = Path('hub/pyproject.toml')
          text = path.read_text()
          version = tomllib.loads(text)['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit('Release tag must match the package version')
          path.write_text(text.replace('https://github.com/<owner>/nuka-esp32',
                                       'https://github.com/' + os.environ['REPOSITORY']))
          PY
      - run: uv build --project hub --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install built wheel with platform extras
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl')).resolve()
          subprocess.run(['uv', 'tool', 'install', '--python', '3.12', f'{wheel}[all]'], check=True)
      - run: nuka --version
      - run: nuka hub --help

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Chinese resources
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r firmware/tools/requirements.txt
          npm ci --prefix firmware/tools --ignore-scripts
          python firmware/tools/gen_theme.py --check
          python firmware/tools/gen_strings.py --check
          python firmware/tools/gen_fonts.py
          version="${RELEASE_TAG#v}"
          if [[ -z "$version" ]]; then version=0.1.0; fi
          python firmware/tools/pack_assets.py --version "$version"
      - name: Build firmware
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
      - name: Collect flash files
        shell: bash
        run: |
          mkdir -p dist
          cp firmware/build/bootloader/bootloader.bin dist/
          cp firmware/build/partition_table/partition-table.bin dist/
          cp firmware/build/ota_data_initial.bin dist/
          cp firmware/build/nuka-esp32.bin dist/
          cp build/nukapack.bin build/nukapack.json dist/
          cp LICENSE THIRD_PARTY.md dist/
          sha256sum dist/*.bin > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flash-files
          path: dist/*

  pypi:
    if: github.event_name == 'release'
    needs: [install, firmware]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*

  docker:
    if: github.event_name == 'release'
    needs: [install, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['REPOSITORY']
          owner = repo.split('/')[0].lower()
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          path = Path('hub/pyproject.toml')
          path.write_text(path.read_text().replace('https://github.com/<owner>/nuka-esp32',
                                                   f'https://github.com/{repo}'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image=ghcr.io/{owner}/nuka-hub\nversion={version}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest

  release-files:
    if: github.event_name == 'release'
    needs: [install, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flash-files
          path: dist
      - name: Attach firmware and resources
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$REPOSITORY"
